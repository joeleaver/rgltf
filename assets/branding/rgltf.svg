<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="rgltf">
  <title>rgltf</title>
  <defs>
    <!-- App-tile background: a subtle dark vertical sheen. -->
    <linearGradient id="tile" x1="256" y1="16" x2="256" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#272f3a"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <!-- Top face: lit teal. -->
    <linearGradient id="top" x1="256" y1="106" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8bede0"/>
      <stop offset="1" stop-color="#4bb9ae"/>
    </linearGradient>
    <!-- Right face: shaded, deeper. -->
    <linearGradient id="right" x1="256" y1="181" x2="330" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#318ea9"/>
      <stop offset="1" stop-color="#16495f"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Shaded half: top + right faces (the "rendered" side) -->
  <path d="M256 106 L386 181 L256 256 L126 181 Z" fill="url(#top)"/>
  <path d="M386 181 L386 331 L256 406 L256 256 Z" fill="url(#right)"/>
  <!-- Bright ridge where the two lit faces meet -->
  <path d="M256 106 L386 181 M256 106 L126 181 M256 256 L386 181" fill="none"
        stroke="#c7f6ef" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wireframe half: the left face, un-shaded, drawn as a mesh -->
  <path d="M126 181 L256 256 L256 406 L126 331 Z" fill="#0f1621" fill-opacity="0.5"/>
  <g fill="none" stroke="#74e3ff" stroke-linecap="round" stroke-linejoin="round">
    <!-- internal mesh grid -->
    <g stroke-width="7" stroke-opacity="0.85">
      <line x1="169.33" y1="206" x2="169.33" y2="356"/>
      <line x1="212.67" y1="231" x2="212.67" y2="381"/>
      <line x1="126" y1="231" x2="256" y2="306"/>
      <line x1="126" y1="281" x2="256" y2="356"/>
    </g>
    <!-- face outline -->
    <path d="M126 181 L256 256 L256 406 L126 331 Z" stroke-width="10"/>
  </g>
  <!-- mesh vertices at the wireframe-face corners -->
  <g fill="#aef0ff">
    <circle cx="126" cy="181" r="9"/>
    <circle cx="256" cy="256" r="9"/>
    <circle cx="256" cy="406" r="9"/>
    <circle cx="126" cy="331" r="9"/>
  </g>
</svg>
